<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manaíra Board</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/img/favicon.png">
</head>

<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">M</div>
      <h1>Manaíra Board</h1>
      <p>Gestão visual de setores e tarefas.</p>

      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" required />

        <label>Senha</label>
        <input id="senha" type="password" required />
        <button type="submit">Entrar</button>
      </form>

      <small id="loginMsg"></small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="logo-row">
        <div class="logo">M</div>
        <div>
          <strong>Manaíra Board</strong>
          <span>Gestão interna</span>
        </div>
      </div>

      <button class="nav-main active" id="btnDashboard">🏠 Dashboard</button>
      <button class="nav-main" id="btnOS">🛠️ Ordem de Serviço</button>
      <button class="nav-main" id="btnMinhas">✅ Minhas tarefas/OS</button>
      <button class="nav-main" id="btnConfig">⚙️ Configurações</button>
      <button class="nav-main" id="btnSolicitarOS" type="button">📲 Solicitar OS</button>
      <button class="new-sector" id="btnNovoSetor">+ Novo setor</button>

      <nav id="setoresList"></nav>

      <div class="sidebar-footer">
        <span id="userName"></span>
        <button id="btnSair">Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <h1 id="setorTitulo">Selecione um setor</h1>
          <p id="setorDescricao">Crie setores e gerencie tarefas por grupos.</p>
        </div>

        <div class="actions">
          <button id="btnExcluirSetor" class="danger hidden">🗑️ Excluir setor</button>
          <button id="btnNovoGrupo">+ Grupo</button>
          <button class="primary" id="btnNovaTarefa">+ Criar tarefa</button>
        </div>
      </header>

      <section class="filters">
        <input id="busca" placeholder="Pesquisar tarefa..." />

        <select id="filtroStatus">
          <option value="">Todos os status</option>
          <option>Não iniciado</option>
          <option>Em andamento</option>
          <option>Parado</option>
          <option>Feito</option>
        </select>

        <select id="filtroPeriodo">
          <option value="todos">Todos os prazos</option>
          <option value="hoje">Hoje</option>
          <option value="semana">Semana atual</option>
          <option value="mes">Mês atual</option>
        </select>

        <button id="btnPdfSetor" class="pdf-sector-btn">📄 PDF do setor</button>
      </section>

      <div id="pageLoading" class="page-loading hidden">
        <div class="spinner"></div>
        <span>Carregando...</span>
      </div>

      <section id="dashboard" class="dashboard"></section>
      <section id="board" class="board hidden"></section>
      <section id="osPanel" class="os-panel hidden"></section>
      <section id="minhasPanel" class="dashboard hidden"></section>
      <section id="configPanel" class="dashboard hidden"></section>

      <section id="printFooter" class="print-footer hidden">
        <button onclick="window.print()">🖨️ Imprimir visão atual</button>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="modalClose">×</button>
      <h2 id="modalTitle">Cadastro</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>

</html>
